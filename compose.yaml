services:
  server:
    build:
      context: .
    ports:
      - 8000:8000
    depends_on:
      db:
        condition: service_healthy
    environment:
      # O servidor usa a variável definida no .env para se conectar
      - DATABASE_URL=postgres://postgres:${DB_PASSWORD}@db:5432/adapta-ai-db

  db:
    image: postgres:17
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=adapta-ai-db
      - POSTGRES_USER=postgres
      # O Docker busca automaticamente o valor de DB_PASSWORD no arquivo .env
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    expose:
      - 5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "adapta-ai-db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data: